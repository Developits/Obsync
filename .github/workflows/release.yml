name: Release Plugin

on:
  push:
    tags:
      # Obsidian requires the tag to match manifest.json exactly (1.1.0, not v1.1.0).
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build & Release Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$VERSION" ]; then
            echo "Release tag must match manifest.json version exactly: $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Validate before releasing
        run: |
          npm run check
          npm test

      - name: Package release assets
        run: |
          node scripts/package.mjs

      - name: Determine tag name
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./manifest.json').version")
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          files: |
            dist/main.js
            dist/manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
